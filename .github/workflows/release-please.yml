name: release-please

# Auto-runs on every push to main. release-please opens / updates a
# rolling release PR collecting Conventional Commit entries; merging
# that PR triggers a tag + npm publish on the next push.
# workflow_dispatch retained for manual re-runs; pass `tag` (e.g.
# loopback-connector-mongodb-v1.1.2) to check out and publish an
# existing release tag whose original publish failed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (leave empty for a normal release-please run)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout
        if: ${{ steps.release.outputs.release_created || inputs.tag != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Node 24 ships npm >= 11.5.1, required for npm trusted publishing (OIDC).
      - name: Setup Node
        if: ${{ steps.release.outputs.release_created || inputs.tag != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          always-auth: true

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created || inputs.tag != '' }}
        run: npm ci --include=optional --no-audit --no-fund

      - name: Build
        if: ${{ steps.release.outputs.release_created || inputs.tag != '' }}
        run: npm run build

      # Authenticates via npm trusted publishing (OIDC, id-token: write);
      # no NPM_TOKEN secret. Provenance is attached automatically.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created || inputs.tag != '' }}
        run: npm publish --access public --provenance
